# Local full-stack run:  docker compose up --build
# Uses a local Postgres, so no Neon account is needed for development.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prepforge
      POSTGRES_PASSWORD: prepforge
      POSTGRES_DB: prepforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepforge"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://prepforge:prepforge@db:5432/prepforge
      - DATABASE_SSL=false
      - JWT_SECRET=${JWT_SECRET:-local-dev-secret-change-me}
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
